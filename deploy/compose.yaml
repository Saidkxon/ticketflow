name: ticketflow

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in deploy/.env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in deploy/.env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set BOOKING_DB_PASSWORD in deploy/.env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in deploy/.env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in deploy/.env}
    ports:
      # Bound to this computer only, never to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first-start initialization the temporary server
      # listens on the socket only, so this stays "unhealthy" until init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The applications run in containers only with the "app" profile; the default "up" starts just
  # the database, so services can still be run from the IDE. One command for everything:
  #   docker compose -f deploy/compose.yaml --profile app up -d --build --wait
  catalog:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog
      CATALOG_DB_USER: catalog
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: only the gateway is reachable from outside (ADR-0013).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_URI: http://catalog:18081
    depends_on:
      catalog:
        condition: service_healthy
    ports:
      # Bound to this computer only, never to the network.
      - "127.0.0.1:${GATEWAY_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    profiles: ["app"]
    build:
      context: ../web
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Bound to this computer only, never to the network. This is the address for the browser.
      - "127.0.0.1:${WEB_PORT:-18090}:8080"
    healthcheck:
      # 127.0.0.1, not localhost: nginx here listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
