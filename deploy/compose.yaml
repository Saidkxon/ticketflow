name: ticketflow

services:
  postgres:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in deploy/.env}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in deploy/.env}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set BOOKING_DB_PASSWORD in deploy/.env}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?set PAYMENT_DB_PASSWORD in deploy/.env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?set NOTIFICATION_DB_PASSWORD in deploy/.env}
    ports:
      # Bound to this computer only, never to the network.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - postgres-data:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Check over TCP: during first-start initialization the temporary server
      # listens on the socket only, so this stays "unhealthy" until init is done.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 12

  # The message broker (ADR-0003). It starts with the "app" profile, or alone with the "broker" profile when you run
  # services from the IDE:  docker compose -f deploy/compose.yaml --profile broker up -d rabbitmq
  rabbitmq:
    profiles: ["app", "broker"]
    image: rabbitmq:4.3.8-management
    restart: unless-stopped
    # A fixed host name: RabbitMQ keeps its data under a name made from it, so a recreated container finds its queues.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ticketflow
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}
    ports:
      # Both bound to this computer only, never to the network. 15673 is the broker, 15674 the management page.
      - "127.0.0.1:${RABBITMQ_PORT:-15673}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15674}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # The applications run in containers only with the "app" profile; the default "up" starts just
  # the database, so services can still be run from the IDE. One command for everything:
  #   docker compose -f deploy/compose.yaml --profile app up -d --build --wait
  catalog:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/catalog-service/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_DB_URL: jdbc:postgresql://postgres:5432/catalog
      CATALOG_DB_USER: catalog
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?set CATALOG_DB_PASSWORD in deploy/.env}
      # Catalog checks access tokens itself and fetches Identity's public keys on first use (ADR-0004).
      IDENTITY_URI: http://identity:18082
      # The outbox relay publishes Catalog's events to the broker. Catalog does not wait for the broker to start:
      # events stay in the outbox until it is reachable (ADR-0003, rule 1).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ticketflow
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: only the gateway is reachable from outside (ADR-0013).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19081/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  booking:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/booking-service/Dockerfile
    restart: unless-stopped
    environment:
      BOOKING_DB_URL: jdbc:postgresql://postgres:5432/booking
      BOOKING_DB_USER: booking
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:?set BOOKING_DB_PASSWORD in deploy/.env}
      # Booking checks access tokens itself and fetches Identity's public keys on first use (ADR-0004).
      IDENTITY_URI: http://identity:18082
      # When Catalog announces a published layout, Booking fetches it from here (ADR-0012). Only while an event is set up.
      CATALOG_URI: http://catalog:18081
      # The consumer connects to the broker by itself and keeps trying while it is down (ADR-0003).
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: "5672"
      RABBITMQ_USER: ticketflow
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in deploy/.env}
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: only the gateway is reachable from outside (ADR-0013).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19083/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  identity:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/identity-service/Dockerfile
    restart: unless-stopped
    environment:
      IDENTITY_DB_URL: jdbc:postgresql://postgres:5432/identity
      IDENTITY_DB_USER: identity
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:?set IDENTITY_DB_PASSWORD in deploy/.env}
      # Access token signing keys are files in a directory (ADR-0004). Make the development key first:
      #   bash scripts/generate-dev-key.sh
      IDENTITY_JWT_KEY_DIRECTORY: /run/keys
      IDENTITY_JWT_SIGNING_KEY_ID: ${IDENTITY_JWT_SIGNING_KEY_ID:-dev-1}
      # The web app origin(s) allowed to call refresh and logout (ADR-0004).
      # Email of the user who becomes the first Admin at startup (see deploy/README.md). Empty: nobody.
      IDENTITY_BOOTSTRAP_ADMIN_EMAIL: ${IDENTITY_BOOTSTRAP_ADMIN_EMAIL:-}
      IDENTITY_ALLOWED_ORIGINS: ${IDENTITY_ALLOWED_ORIGINS:-http://localhost:${WEB_PORT:-18090}}
    volumes:
      - ./keys:/run/keys:ro
    depends_on:
      postgres:
        condition: service_healthy
    # No published ports: reachable only through the gateway, once routes exist (ADR-0013).
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19082/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  gateway:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: services/api-gateway/Dockerfile
    restart: unless-stopped
    environment:
      CATALOG_URI: http://catalog:18081
      IDENTITY_URI: http://identity:18082
      BOOKING_URI: http://booking:18083
      # Request limits per client address and minute (ADR-0013, rule G3). Raise them in deploy/.env when testing a lot.
      GATEWAY_AUTH_LIMIT_PER_MINUTE: ${GATEWAY_AUTH_LIMIT_PER_MINUTE:-10}
      GATEWAY_DEFAULT_LIMIT_PER_MINUTE: ${GATEWAY_DEFAULT_LIMIT_PER_MINUTE:-100}
      GATEWAY_USER_LIMIT_PER_MINUTE: ${GATEWAY_USER_LIMIT_PER_MINUTE:-100}
    depends_on:
      catalog:
        condition: service_healthy
      identity:
        condition: service_healthy
      booking:
        condition: service_healthy
    ports:
      # Bound to this computer only, never to the network.
      - "127.0.0.1:${GATEWAY_PORT:-18080}:18080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  web:
    profiles: ["app"]
    build:
      context: ../web
      args:
        # The location question cannot be skipped unless this is exactly "true" (ADR-0015). It is baked into the build.
        VITE_LOCATION_ALLOW_NOT_NOW: ${VITE_LOCATION_ALLOW_NOT_NOW:-false}
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      # Bound to this computer only, never to the network. This is the address for the browser.
      - "127.0.0.1:${WEB_PORT:-18090}:8080"
    healthcheck:
      # 127.0.0.1, not localhost: nginx here listens on IPv4 only.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 5s

volumes:
  postgres-data:
  rabbitmq-data:
