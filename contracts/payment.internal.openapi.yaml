openapi: 3.1.0
info:
  title: TicketFlow Payment service, internal API
  version: 0.1.0
  description: |
    Endpoints that only other services call (ADR-0002, ADR-0004 Part D, ADR-0006). They live under `/internal/v1`, are
    **not routed by the gateway**, and need a **service token** issued by Identity with the audience `payment-service`
    and the scope named on each operation (`identity.internal.openapi.yaml`). A user's token is never accepted.

    Errors are `application/problem+json` with a stable `code` and the `correlationId` (ADR-0009).

servers:
  - url: http://payment:18084
    description: Inside the Docker network only

tags:
  - name: payment-attempts
    description: Attempts to charge for a booking

paths:
  /internal/v1/payment-attempts:
    post:
      tags: [payment-attempts]
      operationId: createPaymentAttempt
      summary: Create a payment attempt (idempotent)
      description: |
        Needs the scope `payment.attempt.create`.

        Booking calls this when the customer pays. The idempotency key is the booking and the attempt number
        (`<bookingId>:<attemptNumber>`, ADR-0009 part C). The first request creates the payment in the state `PENDING`.
        The same request repeated (a retry after a timeout, a second click) returns the **same payment** and creates and
        charges nothing again (FR-11); the answer is 202 both times. The same key with another amount, currency or test
        card is refused with 422, so a key can never be used to change what was asked.

        The payment is not decided when this call returns. Its result arrives later as the event `PaymentSucceeded` or
        `PaymentFailed` (`events/payment-succeeded.v1.schema.json`, `events/payment-failed.v1.schema.json`), and the
        payment can be read with `GET` meanwhile (ADR-0002). A timeout of the provider is not a failure: the payment
        stays `PENDING` until the provider confirms what happened (ADR-0006, rule R5).

        Payment uses a **simulated provider**: the test card in `testCard` decides the result (see the schema). Only the
        scenario and the last four digits are kept; the number is never stored, logged or returned.
      security: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            pattern: '^[0-9a-fA-F-]{36}:[0-9]{1,2}$'
          description: The booking ID, a colon and the attempt number from 1 to 99
          example: 3f2b8a52-6c1e-4d7a-9b0e-5a1c2d3e4f50:1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentAttempt'
      responses:
        '202':
          description: The payment attempt, new or the one that already existed for this key
          headers:
            Location:
              schema:
                type: string
              description: Where to read the payment
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: A field is missing or malformed, the booking in the body differs from the key, or the key is missing (`IDEMPOTENCY_KEY_REQUIRED`) or malformed (`IDEMPOTENCY_KEY_INVALID`, `INVALID_REQUEST`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid service token (code `UNAUTHENTICATED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A valid token without the scope `payment.attempt.create` (code `FORBIDDEN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The key was already used with another amount, currency or test card (code `IDEMPOTENCY_KEY_REUSED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /internal/v1/payment-attempts/{paymentId}:
    get:
      tags: [payment-attempts]
      operationId: getPaymentAttempt
      summary: Read a payment attempt
      description: Needs the scope `payment.attempt.read`.
      security: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The payment attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '401':
          description: No valid service token (code `UNAUTHENTICATED`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: A valid token without the scope `payment.attempt.read` (code `FORBIDDEN`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such payment (code `NOT_FOUND`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    CreatePaymentAttempt:
      type: object
      additionalProperties: false
      required: [bookingId, amountMinor, currency]
      properties:
        bookingId:
          type: string
          format: uuid
          description: Must be the booking ID in the Idempotency-Key
        amountMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Amount in the smallest unit of the currency
          example: 150000
        currency:
          type: string
          pattern: '^[A-Z]{3}$'
          example: UZS
        testCard:
          type: string
          pattern: '^[0-9]{12,19}$'
          description: |
            A test card number for the simulated provider; it decides how the payment ends. A real provider would take
            a token here, never a card number.

            | Number | What happens |
            |---|---|
            | `4242424242424242` | The charge succeeds at once |
            | `4000000000000002` | The provider declines it (`card_declined`) |
            | `4000000000000259` | The provider times out, then the charge turns out to have succeeded minutes later |
            | `4000000000000077` | The charge succeeds and the provider reports it twice; Payment sends one event |
            | any other number | Declined (`card_declined`) |
            | missing | Declined (`no_payment_method`) |
          example: '4242424242424242'
    Payment:
      type: object
      required: [paymentId, bookingId, attemptNumber, amountMinor, currency, status, createdAt, updatedAt]
      properties:
        paymentId:
          type: string
          format: uuid
        bookingId:
          type: string
          format: uuid
        attemptNumber:
          type: integer
          minimum: 1
          maximum: 99
        amountMinor:
          type: integer
          format: int64
        currency:
          type: string
        status:
          type: string
          enum: [PENDING, SUCCEEDED, FAILED, REFUND_PENDING, REFUNDED]
          description: |
            PENDING until the provider has answered, or confirmed that it did not charge. FAILED is final. SUCCEEDED
            can become REFUND_PENDING when Booking asks for the money back (the event `RefundRequested`, not a call
            of this API) and then REFUNDED, which is final. The refund is reported with `RefundSucceeded`.
        failureReason:
          type: [string, 'null']
          enum: [card_declined, no_payment_method, provider_no_charge, null]
          description: Why the payment failed; null unless the status is FAILED
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        code:
          type: string
        correlationId:
          type: string
