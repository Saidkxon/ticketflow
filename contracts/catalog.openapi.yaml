openapi: 3.1.0
info:
  title: TicketFlow Event Catalog API
  version: 1.0.0
  description: |
    Public API of the Event Catalog service, reached through the API gateway (ADR-0002, ADR-0013).
    This file is the source of truth: a change to behavior starts with a change here (ADR-0009, part E).

    Scope today: the public event list, and an organizer creating and editing draft events and their venue
    layout. Publishing and search are added in later pull requests; additive changes do not create a new major
    version (ADR-0009, part A).

    Reading the list is public. Everything else needs an access token with the ORGANIZER role
    (ADR-0004); a customer gets 403.
servers:
  - url: /api/v1
    description: Same origin as the web app (ADR-0013, rule G10)
tags:
  - name: events
    description: Browsing events
  - name: organizer
    description: Creating and editing events (ORGANIZER role)

paths:
  /events:
    get:
      tags: [events]
      operationId: listEvents
      summary: List published events
      description: |
        Public, no token needed. Pages start at 0. Results are sorted by start time, then by ID,
        so pages do not shuffle (ADR-0009, part D).
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of events (empty when none exist yet)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

    post:
      tags: [organizer]
      operationId: createEvent
      summary: Create a draft event
      description: |
        Needs an access token with the ORGANIZER role. The event belongs to the caller and starts as a DRAFT:
        it is not in the public list. The owner, status and version are never read from the body.
        The response carries the new version as the ETag.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEventRequest'
      responses:
        '201':
          description: The draft was created
          headers:
            Location:
              description: Path of the new event
              schema:
                type: string
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/mine:
    get:
      tags: [organizer]
      operationId: listMyEvents
      summary: List my events, drafts included
      description: |
        Needs an access token with the ORGANIZER role. Returns only events created by the caller, in start-time
        order with the ID as tie-breaker. Not for caching.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: One page of the caller's events (empty when there are none)
          headers:
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MyEventPage'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/{eventId}:
    put:
      tags: [organizer]
      operationId: updateEvent
      summary: Change a draft event
      description: |
        Needs an access token with the ORGANIZER role, and the event must be the caller's own. Replaces title,
        start time, venue and city. The If-Match header must carry the version the caller last saw, written as
        a quoted number such as "3" (the ETag of the last response); without it the answer is 428, and with an
        old version it is 412 and nothing changes. A published event can no longer be edited (409).
        An event of another organizer looks exactly like a missing one (404).
      security:
        - bearerAuth: []
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: If-Match
          in: header
          required: true
          description: The version being changed, as a quoted number, for example "3"
          schema:
            type: string
            pattern: '^"[0-9]{1,18}"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveEventRequest'
      responses:
        '200':
          description: The draft was changed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event is published and can no longer be edited. Code EVENT_NOT_EDITABLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The event was changed by someone else since the caller loaded it. Code PRECONDITION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: The If-Match header is missing. Code PRECONDITION_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/mine/{eventId}:
    get:
      tags: [organizer]
      operationId: getMyEvent
      summary: Read one of my events, draft or published
      description: |
        Needs an access token with the ORGANIZER role. An event of another organizer looks exactly like a
        missing one (404). The ETag is the version to send back in If-Match when changing the event.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The event
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/mine/{eventId}/layout:
    get:
      tags: [organizer]
      operationId: getMyEventLayout
      summary: Read the venue layout of one of my events
      description: |
        Needs an access token with the ORGANIZER role. An event without a saved layout has an empty one
        (no tiers, no sections, zero seats, and a null currency). The ETag is the event version to send back in
        If-Match when saving the layout.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
      responses:
        '200':
          description: The layout
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /events/{eventId}/layout:
    put:
      tags: [organizer]
      operationId: saveEventLayout
      summary: Save the venue layout of a draft event
      description: |
        Needs an access token with the ORGANIZER role, and the event must be the caller's own draft. Replaces the
        whole layout: the seats are generated again, with new IDs, from the sections described in the body.
        A section is a block of lettered rows (A, B, C, ...) with the same number of seats in each row and one
        price tier. Prices are integers in the smallest unit of the event currency.

        The If-Match header must carry the version the caller last saw, as for editing the event itself (428 when
        missing, 412 when old). Saving a layout counts as a change of the event: the version goes up and the new
        one is returned as the ETag. A published event keeps its layout (409).

        Limits: at most 10 tiers, 30 sections, 26 rows per section, 100 seats per row and 5,000 seats in total.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: If-Match
          in: header
          required: true
          description: The version being changed, as a quoted number, for example "3"
          schema:
            type: string
            pattern: '^"[0-9]{1,18}"$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutRequest'
      responses:
        '200':
          description: The layout was saved
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutDetail'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The event is published and keeps its layout. Code EVENT_NOT_EDITABLE.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '412':
          description: The event was changed by someone else since the caller loaded it. Code PRECONDITION_FAILED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '428':
          description: The If-Match header is missing. Code PRECONDITION_REQUIRED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from POST /auth/login or /auth/refresh (see the Identity contract).

  parameters:
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Page:
      name: page
      in: query
      description: Page number, starting at 0
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      description: Items per page (maximum 50)
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20

  headers:
    ETag:
      description: The event version as a strong ETag, for example "3". Send it back in If-Match to change the event.
      schema:
        type: string
    CorrelationId:
      description: Correlation ID of this request (ADR-0009). Created by the gateway when the caller sends none.
      schema:
        type: string
        format: uuid

  schemas:
    EventPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventSummary'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
        totalItems:
          type: integer
          format: int64
          minimum: 0
    EventSummary:
      type: object
      required: [id, title, startsAt, venueName, city]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 in UTC, with a trailing Z
        venueName:
          type: string
        city:
          type: string
    SaveEventRequest:
      type: object
      description: |
        The fields an organizer sets. Texts are trimmed and must not contain control characters.
        Any other field is rejected with 400.
      required: [title, startsAt, venueName, city]
      additionalProperties: false
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        startsAt:
          type: string
          format: date-time
          description: ISO 8601 in UTC, with a trailing Z; must be in the future
        venueName:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
    EventDetail:
      type: object
      description: An event as its organizer sees it
      required: [id, title, startsAt, venueName, city, status, version]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        startsAt:
          type: string
          format: date-time
        venueName:
          type: string
        city:
          type: string
        status:
          type: string
          enum: [DRAFT, PUBLISHED]
        version:
          type: integer
          format: int64
          minimum: 0
          description: Optimistic-locking counter; also sent as the ETag and expected back in If-Match
    MyEventPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventDetail'
        page:
          type: integer
          minimum: 0
        size:
          type: integer
          minimum: 1
          maximum: 50
        totalItems:
          type: integer
          format: int64
          minimum: 0

    LayoutRequest:
      type: object
      description: |
        The venue layout of a draft event. Names are trimmed, must not contain control characters, and tier names
        and section names are each unique without regard to case. Any other field is rejected with 400.
      required: [currency, priceTiers, sections]
      additionalProperties: false
      properties:
        currency:
          type: string
          enum: [UZS, USD, EUR]
        priceTiers:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: '#/components/schemas/PriceTierInput'
        sections:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: '#/components/schemas/SectionInput'
    PriceTierInput:
      type: object
      required: [name, priceMinor]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        priceMinor:
          type: integer
          format: int64
          minimum: 1
          maximum: 1000000000000
          description: Price of one seat in the smallest unit of the currency (never a fraction)
    SectionInput:
      type: object
      required: [name, tier, rows, seatsPerRow]
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 50
        tier:
          type: string
          description: The name of one of the price tiers
        rows:
          type: integer
          minimum: 1
          maximum: 26
          description: Number of rows, lettered A, B, C, ...
        seatsPerRow:
          type: integer
          minimum: 1
          maximum: 100
    LayoutDetail:
      type: object
      required: [currency, priceTiers, sections, totalSeats]
      properties:
        currency:
          type: [string, 'null']
          description: Null until a layout has been saved
        priceTiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTierView'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/SectionView'
        totalSeats:
          type: integer
          minimum: 0
    PriceTierView:
      type: object
      required: [id, name, priceMinor]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        priceMinor:
          type: integer
          format: int64
    SectionView:
      type: object
      required: [id, name, tier, rows, seatsPerRow, seatCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tier:
          type: string
          description: The name of the section's price tier
        rows:
          type: integer
        seatsPerRow:
          type: integer
        seatCount:
          type: integer

    Problem:
      type: object
      description: RFC 9457 Problem Details with our stable machine-readable code (ADR-0009, part B)
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable identifier. Clients switch on this, never on title or detail text.
          examples: [INVALID_REQUEST]
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          description: Present on validation failures (field and problem)
          items:
            type: object
            required: [field, problem]
            properties:
              field:
                type: string
              problem:
                type: string

  responses:
    Unauthenticated:
      description: No access token, or an invalid one. Code UNAUTHENTICATED. The answer never says why.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: The token is valid but lacks the ORGANIZER role. Code FORBIDDEN.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: No such event, or it belongs to another organizer. Code NOT_FOUND.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: Invalid input. Code INVALID_REQUEST.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded. Code RATE_LIMITED.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error. Code INTERNAL_ERROR. No internal details are exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Service or upstream temporarily unavailable. Code UPSTREAM_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
