openapi: 3.1.0
info:
  title: TicketFlow Booking API
  version: 1.0.0
  description: |
    Public API of the Booking service, reached through the API gateway (ADR-0002, ADR-0013).
    This file is the source of truth: a change to behavior starts with a change here (ADR-0009, part E).

    Scope today: seat availability of an event, holding seats, reading and listing the signed-in customer's
    bookings, and releasing a hold. Payment, confirmation and cancelling a confirmed booking are added by later pull
    requests; additive changes do not create a new major version (ADR-0009, part A).

    **Error codes used by this API today:** `EVENT_NOT_ON_SALE`, `INVALID_REQUEST`, `UNAUTHENTICATED`,
    `IDEMPOTENCY_KEY_REQUIRED`, `IDEMPOTENCY_KEY_REUSED`, `REQUEST_IN_PROGRESS`, `SEATS_UNAVAILABLE`,
    `SEATS_BUSY`, `ACTIVE_HOLD_EXISTS`, `NOT_FOUND`, `BOOKING_NOT_ACTIVE`, `RATE_LIMITED`, `INTERNAL_ERROR`, `UPSTREAM_UNAVAILABLE`.
servers:
  - url: /api/v1
    description: Same origin as the web app (ADR-0013, rule G10)
tags:
  - name: availability
    description: Which seats of an event can be taken right now
  - name: bookings
    description: Holding seats for a customer

paths:
  /events/{eventId}/availability:
    get:
      tags: [availability]
      operationId: getSeatAvailability
      summary: The seats of an event that cannot be taken right now
      description: |
        Public, no token (ADR-0004, ADR-0011). It lists seat IDs only, no personal data. A seat is unavailable when it
        is sold, or held with a deadline that is still in the future. A hold whose deadline has passed counts as
        available at once, whether or not the clean-up job has run (ADR-0012). The seat map draws from this list and
        from the layout that Catalog serves (`GET /events/{eventId}/layout`).

        The ETag is derived from the content: the same list gives the same ETag, and a matching `If-None-Match`
        gets 304 with no body. The server may reuse a list for one or two seconds (ADR-0011), so a change can take
        a moment to show. **The map is a hint, not a promise:** the server decides every hold.

        An event without seats in Booking, because it is unknown, still being set up, or not published, answers
        404 `EVENT_NOT_ON_SALE`. The gateway allows 60 availability requests per minute per address (ADR-0013).
      security: []
      parameters:
        - $ref: '#/components/parameters/EventId'
        - name: If-None-Match
          in: header
          required: false
          description: The ETag of a list the caller already has
          schema:
            type: string
      responses:
        '200':
          description: The unavailable seats, sorted by seat ID
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            Cache-Control:
              description: no-cache, so a client asks again (cheaply, with If-None-Match) instead of guessing
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeatAvailability'
        '304':
          description: The caller's list is still current
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '404':
          $ref: '#/components/responses/NotOnSale'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /bookings:
    post:
      tags: [bookings]
      operationId: holdSeats
      summary: Hold seats of an event for the signed-in customer
      description: |
        Takes the seats for a limited time (10 minutes, counted from the database clock) or takes none of them: a
        request for several seats either gets every one or changes nothing (ADR-0012). The customer is the user of
        the access token, never a value in the body. At most 8 seats per hold, and at most one active hold per
        customer per event.

        `Idempotency-Key` is required (ADR-0009, part C). The same key with the same request (the same event and the
        same set of seats, in any order) answers 201 with the same booking and holds nothing twice, also when
        retries run at the same moment. The same key with another request is 422. A request that was refused leaves
        no key behind, so a retry with the same key is evaluated again.

        A seat is taken when it is free now: available, or held with a deadline that has passed. The answer has
        `expiresAt` and `serverTime` from the same database clock, so a countdown does not depend on the clock of
        the device.
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: A UUID chosen by the caller. A retry of the same action reuses it; a new action uses a new one.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HoldRequest'
      responses:
        '201':
          description: The seats are held
          headers:
            Cache-Control:
              description: no-store, the answer is personal
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: |
            Invalid input: a missing or malformed field (`INVALID_REQUEST`, with an `errors` list), a missing
            `Idempotency-Key` (`IDEMPOTENCY_KEY_REQUIRED`), no seats, more seats than allowed, the same seat twice,
            or a seat that is not a seat of this event.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token. Code UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotOnSale'
        '409':
          description: |
            Nothing was held. `SEATS_UNAVAILABLE`: at least one seat is not free; the body has
            `unavailableSeatIds`. `ACTIVE_HOLD_EXISTS`: the customer already holds seats of this event.
            `SEATS_BUSY`: other customers were changing the same seats for longer than the server waits; try again
            in a moment. `REQUEST_IN_PROGRESS`: the first request with this key has not finished.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/SeatConflict'
        '422':
          description: The `Idempotency-Key` was already used for a different request. Code IDEMPOTENCY_KEY_REUSED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

    get:
      tags: [bookings]
      operationId: listMyBookings
      summary: The signed-in customer's bookings, newest first
      description: |
        Every booking of the caller, whatever its status, with its seats. A customer never sees the bookings of
        somebody else. The answer is personal and is never stored by a cache. A booking whose hold deadline has passed
        is shown as EXPIRED even before Booking has released its seats.
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page of bookings (empty when the customer has none)
          headers:
            Cache-Control:
              description: no-store, the answer is personal
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingPage'
        '400':
          description: '`page` or `size` is out of range. Code INVALID_REQUEST, with an `errors` list.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token. Code UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: One booking of the signed-in customer
      description: |
        A booking that belongs to somebody else is answered exactly like one that does not exist (404 NOT_FOUND), so
        nobody can find out which booking IDs exist. `expiresAt` and `serverTime` come from the same database clock.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The booking
          headers:
            Cache-Control:
              description: no-store, the answer is personal
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: '`bookingId` is not a UUID. Code INVALID_REQUEST.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token. Code UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such booking, or it is not the caller's. Code NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

  /bookings/{bookingId}/release:
    post:
      tags: [bookings]
      operationId: releaseHold
      summary: Give up a hold
      description: |
        The booking becomes CANCELLED and its seats are free again at once, in one step. Releasing a booking that
        is already CANCELLED answers 200 with the same booking, so a retry after a lost answer is safe. A hold whose
        deadline has passed cannot be released (409 BOOKING_NOT_ACTIVE): it has already lost its seats. Nothing is
        sent to other services; no money has moved (ADR-0006).
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BookingId'
      responses:
        '200':
          description: The booking, now CANCELLED
          headers:
            Cache-Control:
              description: no-store, the answer is personal
              schema:
                type: string
            X-Correlation-ID:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Booking'
        '400':
          description: '`bookingId` is not a UUID. Code INVALID_REQUEST.'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: No valid access token. Code UNAUTHENTICATED.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: No such booking, or it is not the caller's. Code NOT_FOUND.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: |
            `BOOKING_NOT_ACTIVE`: the hold has ended (EXPIRED). `SEATS_BUSY`: the seats were being changed by other
            requests for longer than the server waits; try again in a moment.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/Unavailable'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    BookingId:
      name: bookingId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  headers:
    ETag:
      description: A weak ETag of the list, for example W/"9f2c4e7a1b3d5f60a8b9c0d1e2f30415" (weak so the body may be compressed)
      schema:
        type: string
    CorrelationId:
      description: Correlation ID of this request (ADR-0009). Created by the gateway when the caller sends none.
      schema:
        type: string
        format: uuid

  schemas:
    SeatAvailability:
      type: object
      required: [eventId, unavailableSeatIds]
      properties:
        eventId:
          type: string
          format: uuid
        unavailableSeatIds:
          type: array
          description: Seat IDs from the layout that cannot be taken right now, sorted; empty when every seat is free
          items:
            type: string
            format: uuid
    HoldRequest:
      type: object
      required: [eventId, seatIds]
      additionalProperties: false
      properties:
        eventId:
          type: string
          format: uuid
        seatIds:
          type: array
          description: Seat IDs from the layout of the event; one to eight, each at most once
          minItems: 1
          maxItems: 8
          uniqueItems: true
          items:
            type: string
            format: uuid
    Booking:
      type: object
      required: [id, eventId, status, currency, totalMinor, expiresAt, serverTime, seats]
      properties:
        id:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        status:
          type: string
          description: |
            HELD while the hold lasts. EXPIRED once the hold deadline has passed (shown as soon as the deadline is
            past, even before Booking has released the seats; a repeated request with the same Idempotency-Key
            returns the booking as it is then). CANCELLED after the customer released the hold. PAYMENT_PENDING (the
            customer started to pay) and CONFIRMED (the payment succeeded and the seats are sold) are part of the
            model from now on (ADR-0006) but no request moves a booking there yet: that comes in the next pull requests.
          enum: [HELD, PAYMENT_PENDING, CONFIRMED, EXPIRED, CANCELLED]
        currency:
          type: string
          description: Three-letter code of the event's currency
          examples: [UZS]
        totalMinor:
          type: integer
          format: int64
          description: Sum of the seat prices in the smallest currency unit (ADR-0005)
        expiresAt:
          type: string
          format: date-time
          description: The hold deadline, database time plus the hold duration
        serverTime:
          type: string
          format: date-time
          description: The database clock when this answer was made; count down from the difference
        seats:
          type: array
          items:
            $ref: '#/components/schemas/BookingSeat'
    BookingSeat:
      type: object
      required: [seatId, section, row, number, tier, priceMinor]
      properties:
        seatId:
          type: string
          format: uuid
        section:
          type: string
        row:
          type: string
        number:
          type: integer
        tier:
          type: string
        priceMinor:
          type: integer
          format: int64
          description: The price when the seat was held, in the smallest currency unit
    SeatConflict:
      description: A refused hold (Problem), with the seats that were not free when the code is SEATS_UNAVAILABLE
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            unavailableSeatIds:
              type: array
              items:
                type: string
                format: uuid
    BookingPage:
      type: object
      required: [items, page, size, totalItems]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Booking'
        page:
          type: integer
        size:
          type: integer
        totalItems:
          type: integer
          format: int64
    Problem:
      type: object
      description: RFC 9457 Problem Details with our stable machine-readable code (ADR-0009, part B)
      required: [type, title, status, code]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        code:
          type: string
          description: Stable identifier. Clients switch on this, never on title or detail text.
          examples: [EVENT_NOT_ON_SALE]
        detail:
          type: string
        instance:
          type: string
        correlationId:
          type: string
          format: uuid
        errors:
          type: array
          description: Present on validation failures (field and problem)
          items:
            type: object
            required: [field, problem]
            properties:
              field:
                type: string
              problem:
                type: string

  responses:
    NotOnSale:
      description: The event has no seats in Booking (unknown, still being set up, or not published). Code EVENT_NOT_ON_SALE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InvalidRequest:
      description: Invalid input, for example an event ID that is not a UUID. Code INVALID_REQUEST.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: Rate limit exceeded. Code RATE_LIMITED.
      headers:
        Retry-After:
          description: Seconds to wait before retrying
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: Unexpected server error. Code INTERNAL_ERROR. No internal details are exposed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Service or upstream temporarily unavailable. Code UPSTREAM_UNAVAILABLE.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
