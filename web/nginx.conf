# One origin for the browser (ADR-0013, rule G10): this server hands out the built web app and
# forwards /api to the gateway, so the browser never makes a cross-origin call and no CORS is set.
# This is the local full-stack setup; the production setup is decided at the deployment gate.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's built-in DNS. The gateway address is looked up again at request time (at most every
    # 10 seconds). Without this, nginx resolves "gateway" once at startup and keeps sending
    # requests to the old address after the gateway container is recreated (502 Bad Gateway).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # A variable makes nginx use the resolver above. The request path is passed on unchanged.
        set $gateway_upstream http://gateway:18080;
        proxy_pass $gateway_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # X-Correlation-ID from the browser is passed on unchanged; the gateway validates it.
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # Built files have content hashes in their names, so they can be cached for a long time.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Any other path is a screen of the single-page app; index.html itself must never be cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
