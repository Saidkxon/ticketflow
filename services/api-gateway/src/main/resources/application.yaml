spring:
  application:
    name: api-gateway
  # Timeouts for calls to services (ADR-0013, rule G6): a starting point to tune from measurements.
  # The gateway builds its calls with Spring Boot's shared HTTP client settings.
  http:
    clients:
      connect-timeout: 5s
      read-timeout: 5s

server:
  port: 18080

# Where the gateway finds each service: a configured address, no discovery server (ADR-0013, rule G11).
ticketflow:
  gateway:
    catalog-uri: ${CATALOG_URI:http://localhost:18081}
    identity-uri: ${IDENTITY_URI:http://localhost:18082}
    # How access tokens are checked (ADR-0004, Part B). The keys come from Identity's address inside the
    # container network; the path is never routed to the outside.
    jwt:
      jwks-uri: ${IDENTITY_URI:http://localhost:18082}/.well-known/jwks.json
    # Request limits (ADR-0013, rules G3 and G7): starting points, to tune from measurements.
    limits:
      auth-per-minute: ${GATEWAY_AUTH_LIMIT_PER_MINUTE:10}
      default-per-minute: ${GATEWAY_DEFAULT_LIMIT_PER_MINUTE:100}
      user-per-minute: ${GATEWAY_USER_LIMIT_PER_MINUTE:100}
      max-body-size: 16KB

# Health endpoints live on their own port, which is never routed (ADR-0008, ADR-0013).
# The gateway has no database, so readiness is only its own state.
management:
  server:
    port: 19080
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
