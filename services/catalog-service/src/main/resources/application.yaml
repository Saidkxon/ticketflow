spring:
  application:
    name: catalog-service
  # Each service owns its own database and role (ADR-0005). The password has no default,
  # so no secret is stored in the repository (NFR-7). If it is missing, Spring keeps the literal
  # placeholder text and the database rejects the login at startup.
  datasource:
    url: ${CATALOG_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/catalog}
    username: ${CATALOG_DB_USER:catalog}
    password: ${CATALOG_DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      connection-timeout: 3000

  # The message broker (ADR-0003). The password has no default, like the database password (NFR-7). Publisher confirms
  # and "mandatory" let the outbox relay know that the broker took a message and that a queue received it.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:ticketflow}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  # A request body with a field we do not know is rejected, so nobody can slip in a field such as "ownerId".
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 18081

# Health endpoints live on their own port, which the gateway never routes (ADR-0008, ADR-0013).
# Readiness depends on this service's own database only (ADR-0008).
management:
  server:
    port: 19081
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  # The broker is deliberately not part of readiness: when it is down, Catalog still serves its reads and writes, and the
  # outbox keeps the events until it is back (ADR-0003, rule 1).
  health:
    rabbit:
      enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Access tokens (ADR-0004). Identity's public keys are fetched on first use from Identity, inside the
# container network only, so Catalog starts even when Identity is not up yet.
ticketflow:
  catalog:
    # The outbox relay publishes the events written by Catalog to the broker (ADR-0003). Defaults are in OutboxProperties.
    outbox:
      exchange: ticketflow.events
    jwt:
      jwks-uri: ${IDENTITY_URI:http://localhost:18082}/.well-known/jwks.json
