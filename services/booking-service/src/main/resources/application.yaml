spring:
  application:
    name: booking-service
  # Each service owns its own database and role (ADR-0005). The password has no default,
  # so no secret is stored in the repository (NFR-7). If it is missing, Spring keeps the literal
  # placeholder text and the database rejects the login at startup.
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/booking}
    username: ${BOOKING_DB_USER:booking}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  # A request body with a field we do not know is rejected.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 18083

# Health endpoints live on their own port, which the gateway never routes (ADR-0008, ADR-0013).
# Readiness depends on this service's own database only (ADR-0008). The broker joins the picture
# when Booking starts consuming events.
management:
  server:
    port: 19083
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Access tokens (ADR-0004). Identity's public keys are fetched on first use from Identity, inside the
# container network only, so Booking starts even when Identity is not up yet.
ticketflow:
  booking:
    jwt:
      jwks-uri: ${IDENTITY_URI:http://localhost:18082}/.well-known/jwks.json
