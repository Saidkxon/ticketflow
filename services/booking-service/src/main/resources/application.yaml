spring:
  application:
    name: booking-service
  # Each service owns its own database and role (ADR-0005). The password has no default,
  # so no secret is stored in the repository (NFR-7). If it is missing, Spring keeps the literal
  # placeholder text and the database rejects the login at startup.
  datasource:
    url: ${BOOKING_DB_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/booking}
    username: ${BOOKING_DB_USER:booking}
    password: ${BOOKING_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 3000

  # The message broker (ADR-0003). The password has no default, like the database password (NFR-7). Publisher confirms
  # and "mandatory" let Booking know that the broker took a message it parks in the dead-letter queue.
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:15673}
    username: ${RABBITMQ_USER:ticketflow}
    password: ${RABBITMQ_PASSWORD}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        # A failing message is never put straight back at the front of the queue (that would spin). The listener
        # decides: retry later through the retry queue, or park it in the dead-letter queue.
        default-requeue-rejected: false

  # A request body with a field we do not know is rejected.
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 18083
  # The availability list of a big venue can be tens of kilobytes (ADR-0011): compress JSON above 1 KB.
  compression:
    enabled: true
    mime-types: application/json
    min-response-size: 1KB

# Health endpoints live on their own port, which the gateway never routes (ADR-0008, ADR-0013).
# Readiness depends on this service's own database only (ADR-0008). The broker is deliberately not part of it:
# when it is down, Booking still sells seats it already has, and the consumer reconnects by itself (NFR-3).
management:
  server:
    port: 19083
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  health:
    rabbit:
      enabled: false

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"

# Access tokens (ADR-0004). Identity's public keys are fetched on first use from Identity, inside the
# container network only, so Booking starts even when Identity is not up yet.
ticketflow:
  booking:
    # Seat inventory is built from the layout that Catalog publishes (ADR-0012). Other defaults: ProvisioningProperties.
    provisioning:
      catalog-uri: ${CATALOG_URI:http://localhost:18081}
    # How long the list of unavailable seats of an event is reused (ADR-0011: one or two seconds).
    availability:
      cache-ttl: 2s
    # Holds (ADR-0012): at most 8 seats, 10 minutes, and a seat that another request is changing is waited for at most
    # 2 seconds. Other defaults: HoldProperties.
    holds:
      max-seats: 8
      duration: 10m
      lock-timeout: 2s
    jwt:
      jwks-uri: ${IDENTITY_URI:http://localhost:18082}/.well-known/jwks.json
