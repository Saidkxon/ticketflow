# Activate with the "local" profile when running from the repository root:
# reads the git-ignored deploy/.env, so the database password never lives in the repository.
spring:
  config:
    import: optional:file:./deploy/.env[.properties]

# The development key made by: bash scripts/generate-dev-key.sh (git-ignored, never used outside development).
ticketflow:
  identity:
    jwt:
      key-directory: ./deploy/keys
      signing-key-id: dev-1
