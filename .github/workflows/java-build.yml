name: java-build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  java-build:
    name: java-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and test
        run: ./mvnw -B verify
